<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notas</title>
  <link rel="preload" href="fonts/barlow-semi-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-locked">
  <div id="progress" class="progress" hidden></div>

  <!-- Inicio de sesión / creación de cuenta -->
  <main id="auth" class="auth" hidden>
    <div class="auth-card">
      <h1 class="brand">Notas</h1>
      <h2 id="auth-title" class="auth-title">Iniciar sesión</h2>
      <p id="auth-intro" class="auth-intro" hidden></p>
      <form id="auth-form" novalidate>
        <label for="auth-user">Usuario</label>
        <input id="auth-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30" required>
        <label for="auth-pass">Contraseña</label>
        <div class="pass-field">
          <input id="auth-pass" type="password" name="password" autocomplete="current-password" maxlength="200" required>
          <button type="button" class="link-btn pass-toggle" aria-controls="auth-pass" aria-pressed="false">Mostrar</button>
        </div>
        <p id="auth-hint" class="auth-hint" hidden></p>
        <p id="auth-error" class="form-error" role="alert" hidden></p>
        <button class="btn btn-primary auth-submit" id="auth-submit" type="submit">Entrar</button>
      </form>
      <p id="auth-switch-row" class="auth-switch">
        <span id="auth-switch-text"></span>
        <button type="button" class="link-btn" id="auth-switch"></button>
      </p>
    </div>
  </main>

  <div class="app">
    <aside class="menu" id="menu" aria-label="Menú">
      <div class="menu-top">
        <h1 class="brand">Notas</h1>
        <button id="close-menu" class="btn menu-close" type="button">Ver notas</button>
      </div>

      <section class="panel" aria-labelledby="cal-title">
        <h2 id="cal-title" class="panel-title">Calendario</h2>
        <div id="calendar" class="calendar"></div>
      </section>

      <section class="panel panel-grow" aria-labelledby="filters-title">
        <div class="panel-head">
          <h2 id="filters-title" class="panel-title">Filtros</h2>
          <button id="clear-filters" class="link-btn" type="button" hidden>Limpiar</button>
        </div>
        <div id="filters"></div>
      </section>

      <section class="account" aria-label="Cuenta">
        <p class="account-name">Sesión: <b id="account-name"></b></p>
        <div class="account-actions">
          <button type="button" class="link-btn" id="change-pass">Cambiar contraseña</button>
          <button type="button" class="link-btn" id="logout">Cerrar sesión</button>
        </div>
      </section>
    </aside>

    <main class="board">
      <header class="board-head">
        <h2 id="board-title" tabindex="-1">En cola</h2>
        <p id="board-summary" class="board-summary">Cargando notas…</p>
        <p id="live-status" class="live-status" role="status" hidden>Sin conexión en vivo. Reintentando…</p>
        <div class="search" role="search">
          <label for="search" class="sr-only">Buscar notas</label>
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Buscar notas" autocomplete="off" enterkeyhint="search" title="Buscar notas (/)">
          <kbd class="search-key" aria-hidden="true">/</kbd>
        </div>
        <button id="open-menu" class="btn filters-btn" type="button" aria-controls="menu" aria-expanded="false">
          Filtros<span id="filters-badge" class="badge" hidden></span>
        </button>
      </header>
      <ol id="tickets" class="tickets"></ol>
      <div id="board-empty" class="board-empty" hidden></div>
    </main>
  </div>
  <div id="menu-backdrop" class="menu-backdrop" hidden></div>

  <button id="new-note" class="fab" type="button" aria-label="Nueva nota" title="Nueva nota (N)">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <!-- Bloc de notas -->
  <dialog id="editor" class="sheet sheet-wide" aria-labelledby="editor-title">
    <form method="dialog" class="sheet-inner" id="editor-form">
      <header class="sheet-head">
        <h2 id="editor-title">Nueva nota</h2>
        <button class="icon-btn" value="cancel" aria-label="Cerrar">&times;</button>
      </header>
      <div class="editor-grid">
        <div class="editor-col">
          <div class="editor-tools" role="toolbar" aria-label="Insertar al inicio de una línea">
            <button type="button" class="tool" data-insert="#"><b>#</b> Pendiente</button>
            <button type="button" class="tool" data-insert="@"><b>@</b> Etiqueta</button>
            <button type="button" class="tool" data-insert="$"><b>$</b> Prioridad</button>
            <button type="button" class="tool" data-insert="!"><b>!</b> Fecha</button>
          </div>
          <label for="editor-text" class="sr-only">Texto de la nota</label>
          <textarea id="editor-text" spellcheck="true" placeholder="Titulo: Reunión con Edu Rosales
Reunión sobre contingencia, pendientes de planillas y Federación

#enviar correo a John Obregón >Lucía
#terminar de procesar las planillas

@Apolo
$Alta
!viernes" aria-describedby="editor-suggest"></textarea>
          <div id="editor-suggest" class="suggest" aria-live="polite" hidden></div>
        </div>
        <div class="editor-col">
          <p class="preview-label">Así quedará el ticket</p>
          <div id="editor-preview" class="preview" aria-live="polite"></div>
        </div>
      </div>
      <p id="editor-remote" class="form-warning" role="alert" hidden></p>
      <p id="editor-error" class="form-error" role="alert" hidden></p>
      <footer class="sheet-foot">
        <span class="hint">Ctrl + Enter para guardar</span>
        <button class="btn" value="cancel">Cancelar</button>
        <button class="btn btn-primary" id="editor-save" type="button">Guardar nota</button>
      </footer>
    </form>
  </dialog>

  <!-- Detalle de la nota -->
  <dialog id="detail" class="sheet" aria-labelledby="detail-title">
    <div class="sheet-inner" id="detail-body"></div>
  </dialog>

  <!-- Cambiar contraseña -->
  <dialog id="password-dialog" class="sheet" aria-labelledby="password-title">
    <form class="sheet-inner" id="password-form" novalidate>
      <header class="sheet-head">
        <h2 id="password-title">Cambiar contraseña</h2>
        <button type="button" class="icon-btn" aria-label="Cerrar" id="password-close">&times;</button>
      </header>
      <input type="text" name="username" autocomplete="username" id="password-user" hidden>
      <label for="pass-current">Contraseña actual</label>
      <input id="pass-current" type="password" autocomplete="current-password" maxlength="200" required>
      <label for="pass-new">Contraseña nueva</label>
      <input id="pass-new" type="password" autocomplete="new-password" minlength="8" maxlength="200" required>
      <p class="auth-hint">Al menos 8 caracteres. Se cerrará la sesión en tus otros dispositivos.</p>
      <p id="password-error" class="form-error" role="alert" hidden></p>
      <footer class="sheet-foot">
        <button type="button" class="btn" id="password-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button id="toast-action" class="toast-action" type="button" hidden></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
