server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # IP real del visitante cuando la app está detrás del proxy inverso.
    # Solo se confía en la cabecera X-Forwarded-For si la conexión viene de
    # la red "proxy" (subred fija definida en servidor-casa). En modo directo
    # ninguna conexión viene de ahí, así que nadie puede falsear su IP.
    set_real_ip_from 10.250.250.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Avisos en vivo (Server-Sent Events): conexión larga y sin búfer
    location = /api/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Todo lo que empiece por /api va al backend (mismo origen, sin CORS)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
